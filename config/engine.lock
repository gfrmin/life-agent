# The decider engine (proplang-host), pinned in one place. `make engine` reads this.
# RELEASE_TAG is empty until proplang publishes a release; until then `make engine` builds
# COMMIT from source (GHC 9.10.3 via ghcup, ~2 min) and the sha256 below only verifies a
# downloaded release asset (a local cabal build is not bit-reproducible).
