# Schema example for $LIFE_AGENT_KB/utility/model.yaml — the utility posterior's
# gauge + priors (bayesian-foundations §4.4: utility as inference).
#
# The real file lives OUT OF TREE (values are personal data, PRINCIPLES §12) and is
# owner-editable: editing a prior is a stated modelling change; stating a number you
# believe belongs in elicitations.jsonl instead (evidence, never definition).
#
# - gauge: convention, not estimate — behaviour identifies utility only up to positive
#   affine transform. Never edit (load_model verifies it).
# - latents: each gets an inclusive evenly spaced grid plus a gaussian prior discretised
#   onto it. A grid is a truncation: choose bounds wide enough that endpoint mass stays
#   negligible — the posterior monitors it and warns "widen" (never renormalise).
# - tau: the rationality temperature. Marginalised against this prior, never updated —
#   τ and U are non-identifiable from choice data in principle, so this prior does
#   permanent, load-bearing work (§4.4). Its grid is positive by domain (a noise scale),
#   which is a constraint, not a preference (§10).
# - Units: u(correct) = +1, u(abstain) = 0. "u_wrong: -9" means a wrong report is nine
#   correct-answers-worth of bad — the owner's declared 10:1 exchange rate (2026-06-18, dialled
#   back from 20:1), so an UNqualified current-value claim asserts only above p* = w/(1+w) = 0.90.
#   u_wrong_scoped is the
#   far cheaper cost of MISQUOTING a document in a time-scoped claim ("as of <date>, X") — a
#   citable, self-correcting error, not the catastrophic act-on-a-stale-value one (scoped-claims
#   design §3.1). Both are declared standing preferences, narrowed only from real verdicts.
format_version: 1
gauge:
  u_correct: 1.0
  u_abstain: 0.0
latents:
  u_wrong:         {grid: {lo: -40.0, hi: 8.0, n: 97}, prior: {type: gaussian, mu: -9.0, sigma: 3.0}}
  u_wrong_scoped:  {grid: {lo: -12.0, hi: 1.0, n: 53}, prior: {type: gaussian, mu: -2.0, sigma: 1.5}}
  u_hedged:        {grid: {lo: -2.0, hi: 1.5, n: 36},  prior: {type: gaussian, mu: 0.4, sigma: 0.4}}
  lambda_int:      {grid: {lo: -2.5, hi: 6.0, n: 35},  prior: {type: gaussian, mu: 1.0, sigma: 1.0}}
  kappa_att:       {grid: {lo: -0.2, hi: 1.0, n: 25},  prior: {type: gaussian, mu: 0.05, sigma: 0.1}}
  # lambda_usd: the $↔utility exchange rate — gauge units (correct-answers-worth) per US
  # dollar. Positive by domain (a rate, like tau — the floor is a constraint, not a
  # preference). The prior encodes the months-operating $1 ≈ 1·u_correct convention:
  # sigma 0.35 keeps the TRUNCATED mean at ≈1.002 (drift-gated in tests — an N(1,1)
  # draft truncated to [0,8] means 1.288, a silent 29% re-pricing; the truncation shift
  # is computed, never assumed). Frozen BEFORE any elicitation; the owner's one line
  # ("how many correct answers is a dollar worth to me?") in elicitations.jsonl narrows it.
  lambda_usd:      {grid: {lo: 0.0, hi: 8.0, n: 33},   prior: {type: gaussian, mu: 1.0, sigma: 0.35}}
tau:
  grid: {lo: 0.2, hi: 5.0, n: 8}
  prior: {type: gaussian, mu: 1.0, sigma: 1.0}
# The narrative event-shape τ (§4.4/§7.1): the raw inclusion margin is in gauge units (O(1)),
# so τ here is the owner's choice-noise scale in those units — kept separate from `tau` above,
# which tempers lookup's *normalised* threshold form, so the two never silently cross-weight.
# Optional: omitting it falls back to `tau`. Frozen-blind (never tuned to a gate result).
tau_narrative:
  grid: {lo: 0.1, hi: 3.0, n: 8}
  prior: {type: gaussian, mu: 0.5, sigma: 0.5}
endpoint_mass_warn: 0.01
