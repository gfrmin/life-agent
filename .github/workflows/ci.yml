name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# uv reads requires-python (>=3.13,<3.14) and installs the right Python itself.
env:
  UV_FROZEN: "1"   # never mutate the lockfile in CI; fail if it's stale

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pandoc extracts the (markdown) sample corpus and is exercised by the
      # extraction tests. The ML extractors (docling/unstructured/tesseract) are
      # Python deps installed by `uv sync`; the sample/smoke path never invokes them.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Full sync (faithful to uv.lock). This pulls the heavy extractor stack;
      # a lighter install via optional extras is a worthwhile follow-up but would
      # change the default dependency contract, so it is deferred deliberately.
      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        # Whole tree (incl. .githooks): scoping to src/tests/scripts let the PII
        # guard's own lint rot unnoticed.
        run: uv run ruff check .

      - name: Typecheck (mypy — strict on src, lenient on scripts; see pyproject)
        run: uv run mypy

      # r23 (F12/P6): prove the harness can speak BEFORE believing any green from it.
      # A green test step is otherwise indistinguishable from a step that ran nothing —
      # a conftest import error, a bad marker expression, zero items collected. This file
      # is deliberately failing and the job requires it to go red.
      # r25 (L4): require a REPORTED FAILURE, not merely a non-zero exit. Measured: a real
      # assertion failure exits 1, a missing file exits 4, and a control renamed so nothing
      # is collected exits 5 — the old `if pytest; then fail; fi` read all three as "went
      # red as required", so the control could be deleted outright and CI still recorded
      # that it spoke. Exit 1 AND the named test in the failure summary.
      - name: Positive control (the harness must be able to fail)
        run: |
          set +e
          out=$(uv run pytest tests/poison/harness_control.py -q 2>&1); rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "::error::positive control exited $rc, expected 1 — $rc means no tests collected, a collection error, or a missing file, not a reported assertion failure"
            exit 1
          fi
          if ! echo "$out" | grep -q "harness_control.py::test_the_harness_can_report_a_failure"; then
            echo "::error::positive control exited 1 but the expected test id is absent from the report — the harness did not run the control"
            exit 1
          fi
          echo "harness positive control reported a real failure, as required"

      - name: Tests
        # `system`-marked tests need heavy producer runtime (tesseract binary,
        # docling models) not present on a minimal runner; they run locally.
        run: uv run pytest -m "not llm and not system"

      - name: PII guard (shapes-only over the tracked tree)
        run: uv run python .githooks/pii_check.py --shapes-only

      - name: Fresh-clone smoke (sample corpus → cited retrieval, no API key)
        run: scripts/smoke-fresh-clone.sh
