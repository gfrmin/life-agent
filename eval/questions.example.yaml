# ILLUSTRATIVE EXAMPLE — fake data. The real eval set lives at
# $LIFE_AGENT_KB/eval/questions.yaml (out of tree, PII). See README.md.
#
# Ground truth is the ANSWER (the fact), not a source_id — robust to corpus growth and
# source-agnostic. scripts/run_eval.py grades whether the answer surfaces in a top-k
# retrieved chunk (token-boundary match), and classifies failures by MODE.
questions:
  - id: q-001
    question: "What is Pat Doe's national ID number?"
    subject: me
    answer: "123456789"
    distractors: ["987654321"]        # a housemate's ID — confusable wrong subject
    search_queries: ["123456789", "national id"]
    notes: "PASS if 123456789 is in a top-k chunk; the housemate's ID being retrieved flags SUBJECT_CONFUSION (orthogonal to the verdict)."

  - id: q-002
    question: "When does Pat's passport expire?"
    subject: me
    answer: "2031-08-14"
    answer_variants: ["14/08/2031"]
    search_queries: ["passport expiry", "2031"]
    mode_hint: coverage
    notes: "If the passport scan isn't ingested -> ABSENT_COVERAGE; if ingested but OCR-garbled -> set mode_hint: extraction."

  - id: q-003
    question: "Summarise Pat's argument in the 2024 grant proposal."
    subject: n/a
    answer: "prioritise rural clinics over urban expansion"
    fuzzy: true
    search_queries: ["grant proposal 2024 argument rural clinics"]
    notes: "fuzzy: a sentence answer, graded by the LLM judge rather than the token matcher (Phase 2)."
