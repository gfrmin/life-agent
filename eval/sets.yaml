# The scoreboard's sets. `path` is relative to $LIFE_AGENT_KB (owner data never enters the
# repo); `sha256` pins the bytes, so a board row names exactly what it scored. A set whose
# file is absent is listed as "not scored" with the reason, never silently dropped.
#
# kind: paired — one JSONL row per question, `typed` and `mono` (the recorded oracle) arms
# on the same row, as a gate run archives them. The board scores three arms from it:
# typed, oracle, and router (typed where typed asserted, otherwise the oracle — a
# recombination of recorded responses, no model call). `arms:` names the ones a set emits
# (default: all three).
#
# Calibration (the `log score` / `ECE` columns and the Calibration section) is read from the
# archive's own `typed.p1` fields. An archive that predates them may name, instead,
# `questions:` (a path under the set's root) and `decisions_run:` (a run_id): its calibration
# is then taken from the decision log for that run, joined to those questions.
sets:
  owner:
    kind: typed
    path: eval/typed/gate-typed-20261001T095002.jsonl
    sha256: 9ef07dd5d13a345d2c8d5b7c44967007d6d961a2d5a5387df4fa869bced1ac7c
    note: >-
      The owner's 104 questions, typed arm only, re-run 2026-10-01 with every elicited
      half-life scaled by 2 (`pricing.HALF_LIFE_SCALE`, fitted out of fold from the
      2026-09-30 decide states with the withheld negatives in) against the corpus pin
      full-2026-06-11 (catalogue digest 03d1b09c…): 41 right / 0 wrong / 26 cite-right / 0
      cite-wrong / 37 declined, list price $1.19 (the menu's prices for the probes applied),
      metered $0.01 because nearly every call replayed from the cache. Calibration is the
      archive's own (`typed.p1`): 103 scored, mean log score -0.423, ECE 0.137 (the row before
      it: -0.474, 0.153). Replaces the 2026-09-30 row with the `cite` row at the elicited
      half-lives (34/0 + 29 cite-right/0 + 41): its 34 rights are right again, 6 of its 29
      right pointers became right answers, 3 of its 41 declines became right pointers and 1 a
      right answer; 23 pointers and 37 declines stand, nothing else moved. The 26 cites name
      a document at `p1` 0.60-0.89 and every one attests the gold (22 with the leading
      candidate correct, 4 with it wrong but the document right). 20 of the 37 declines still
      had the correct leader, 1 had no candidate. The outside and router rows for this set
      are the frozen recordings under `owner-0920`.
  owner-0920:
    kind: paired
    arms: [outside, router]
    path: eval/gate-outside-option/paired-gate-20260920T160935-strict.jsonl
    sha256: de0078c94030a2e7a4625071e1c0653cdc39d654c60ea85079c107d95e83d147
    note: >-
      FROZEN RECORDINGS from 2026-09-20, the owner's 104 questions (corpus pin
      full-2026-06-11): the outside arm is the live deliberative rung's ANSWER line at the
      cost the call recorded, graded by exact match (87 right / 13 wrong / 4 declined). The
      router row recombines that OUTSIDE arm with the 2026-09-20 typed arm (48/0/56), NOT
      with today's `owner/typed` row: typed where that asserted, otherwise the outside
      answer, at the sum of both costs. Neither row has been re-run; the typed arm of this
      archive is not a board row (see `owner`). Both were priced at their declared prices on
      one grader with J1's host Bayes act; they replace run 18 (the Julia daemon, 2026-08-26,
      paired-gate-20260826T083356-strict-priced.jsonl).
  generated:
    kind: typed
    path: eval/typed/gate-typed-20261001T095504.jsonl
    sha256: 7e28b3c5353e7e2b25d7c7ae3c0a2f25d8382781c4b1c7ecb00546fe9cc6bcba
    note: >-
      The generated golden set: 212 verbatim point-fact questions extracted from the owner's
