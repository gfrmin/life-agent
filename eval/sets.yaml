# The scoreboard's sets. `path` is relative to $LIFE_AGENT_KB (owner data never enters the
# repo); `sha256` pins the bytes, so a board row names exactly what it scored. A set whose
# file is absent is listed as "not scored" with the reason, never silently dropped.
#
# kind: paired — one JSONL row per question, `typed` and `mono` (the recorded oracle) arms
# on the same row, as a gate run archives them. The board scores three arms from it:
# typed, oracle, and router (typed where typed asserted, otherwise the oracle — a
# recombination of recorded responses, no model call).
sets:
  owner:
    kind: paired
    path: eval/gate-outside-option/paired-gate-20260826T083356-strict-priced.jsonl
    sha256: 643de3cfdb21fd8269bcea949453843f1c0afcf6721704fe782b409cb74a67d0
    note: >-
      run 18 (2026-08-26), the owner's 104 questions, both arms on ONE GRADER and ONE PRICE
      LIST. Grader: each arm is graded on the answer it commits, by exact match (the outside
      option had replayed a prose run and counted a gold found anywhere in a paragraph:
      0.897 against 0.805 on the same live answers; scripts/regrade_outside_option.py).
      Prices: the typed arm's cost_usd is the menu's declared price of every probe it
      applied, cache or no cache (scripts/recost_paired.py, from the run's m5-base A-loop
      record, identical to it on 103 of 104 rows); it had been priced at what its warm
      replays metered — $0.37 for a policy that called the deliberative rung on 40 questions
      at $0.38 each. The outside arm is the live deliberative rung's ANSWER line at the cost
      the call recorded. Incumbent until J1's arm replaces it.
  atm:
    kind: pending
