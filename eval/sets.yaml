# The scoreboard's sets. `path` is relative to $LIFE_AGENT_KB (owner data never enters the
# repo); `sha256` pins the bytes, so a board row names exactly what it scored. A set whose
# file is absent is listed as "not scored" with the reason, never silently dropped.
#
# kind: paired — one JSONL row per question, `typed` and `mono` (the recorded oracle) arms
# on the same row, as a gate run archives them. The board scores three arms from it:
# typed, oracle, and router (typed where typed asserted, otherwise the oracle — a
# recombination of recorded responses, no model call).
sets:
  owner:
    kind: paired
    path: eval/gate-outside-option/paired-gate-20260826T083356-strict.jsonl
    sha256: 4085133b06476985b135a97ca3cebb05ae4f92d92b5a824833b72b45033ae153
    note: >-
      run 18 (2026-08-26), the owner's 104 questions. BOTH arms on one grader: each is
      graded on the answer it commits, by exact match. The typed arm always was; the
      outside option was not — it replayed a prose run and counted as right whenever the
      gold appeared anywhere in a paragraph, which on the same live answers is 0.897
      against 0.805 (scripts/regrade_outside_option.py). The outside arm is now the live
      deliberative rung's ANSWER line at the cost the call recorded. Incumbent until J1's
      arm replaces it.
