      declared prior, u_wrong -9, bar 0.90) and the gather row is config/gather-row.example.json,
      because a fresh KB has fitted neither — which is exactly the configuration a stranger
      runs. 8 right / 0 wrong / 6 declined. Re-running it needs an API key; scoring the
      pinned bytes needs nothing.
