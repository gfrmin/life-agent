# The scoreboard's sets. `path` is relative to $LIFE_AGENT_KB (owner data never enters the
# repo); `sha256` pins the bytes, so a board row names exactly what it scored. A set whose
# file is absent is listed as "not scored" with the reason, never silently dropped.
#
# kind: paired — one JSONL row per question, `typed` and `mono` (the recorded oracle) arms
# on the same row, as a gate run archives them. The board scores three arms from it:
# typed, oracle, and router (typed where typed asserted, otherwise the oracle — a
# recombination of recorded responses, no model call). `arms:` names the ones a set emits
# (default: all three).
#
# Calibration (the `log score` / `ECE` columns and the Calibration section) is read from the
# archive's own `typed.p1` fields. An archive that predates them may name, instead,
# `questions:` (a path under the set's root) and `decisions_run:` (a run_id): its calibration
# is then taken from the decision log for that run, joined to those questions.
sets:
  owner:
    kind: typed
    path: eval/typed/gate-typed-20260930T225641.jsonl
    sha256: c4601eaa202df47c20f0adda4fde1169f36d62ad8c3ae80c296d4d74b991b38c
    note: >-
      The owner's 104 questions, typed arm only, re-run 2026-09-30 with the `cite` row
      (partial answers: the document named, not the value) against the corpus pin
      full-2026-06-11 (catalogue digest 03d1b09c…): 34 right / 0 wrong / 29 cite-right / 0
      cite-wrong / 41 declined, list price $1.32 (the menu's prices for the probes applied),
      metered $0 because every call replayed from the cache of the cold run earlier the same
      day. Calibration is the archive's own (`typed.p1`): 103 scored, mean log score -0.474,
      ECE 0.153. Replaces the same day's row without the cite row (43/0/61, the earlier
      draw): 34 of its 43 rights are right again, 9 became right pointers (a cite pre-empts
      a value answer where the document's mass is between the cite row's and the respond
      row's crossing), and 20 of its declines became right pointers; nothing else moved.
      The 29 cites name a document at `p1` 0.59-0.89 and every one attests the gold (26
      with the leading candidate correct, 3 with it wrong but the document right). 24 of the
      41 declines still had the correct leader. The outside and router rows for this set are
      the frozen recordings under `owner-0920`.
  owner-0920:
    kind: paired
    arms: [outside, router]
    path: eval/gate-outside-option/paired-gate-20260920T160935-strict.jsonl
    sha256: de0078c94030a2e7a4625071e1c0653cdc39d654c60ea85079c107d95e83d147
    note: >-
      FROZEN RECORDINGS from 2026-09-20, the owner's 104 questions (corpus pin
      full-2026-06-11): the outside arm is the live deliberative rung's ANSWER line at the
      cost the call recorded, graded by exact match (87 right / 13 wrong / 4 declined). The
      router row recombines that OUTSIDE arm with the 2026-09-20 typed arm (48/0/56), NOT
      with today's `owner/typed` row: typed where that asserted, otherwise the outside
      answer, at the sum of both costs. Neither row has been re-run; the typed arm of this
      archive is not a board row (see `owner`). Both were priced at their declared prices on
      one grader with J1's host Bayes act; they replace run 18 (the Julia daemon, 2026-08-26,
      paired-gate-20260826T083356-strict-priced.jsonl).
  generated:
    kind: typed
    path: eval/typed/gate-typed-20260930T230047.jsonl
    sha256: d369c26bd1b9c8b084769dc63d1e67e1768e5d5207dee4ad9102713ba948123a
    note: >-
      The generated golden set: 212 verbatim point-fact questions extracted from the owner's
      corpus by the generator (claude-haiku-4-5-20251001, prompt sha ea86a53553e58005;
      questions file sha256 2a548ef4239c4347 in $LIFE_AGENT_KB/eval/questions_generated.yaml).
      Re-run 2026-09-30 with the `cite` row (partial answers: the document named, not the
      value) against the corpus pin full-2026-06-11 (catalogue digest 03d1b09c…): 71 right /
      4 wrong / 44 cite-right / 0 cite-wrong / 93 declined, list price $2.57, metered $0
      because every call replayed from the cache of the 2026-09-20 cold run. Calibration is
      the archive's own (`typed.p1`): 198 scored, mean log score -0.428, ECE 0.142; leaders
      given 0.6-0.9 were right about 96% of the time (64 rows), leaders given under 0.4
      about 43% (51 rows), the top bin 0.947 stated against 0.946 realised. Every question's
      answer is in the corpus by construction, so this reads calibration on answerable
      questions only. Replaces the same day's row without the cite row (81/4/127): 71 of
      its 81 rights are right again, 10 became right pointers, 34 of its 127 declines became
      right pointers, and all 4 wrongs are wrong again (a wrong value at `p1` above the
      respond crossing is not reached by the cite row). The 44 cites name a document at `p1`
      0.41-0.89 and every one attests the gold (41 with the leading candidate correct, 3
      with it wrong but the document right); predicted from the captured decide states
      before the run: 74/4 + 40 cite-right / 2 cite-wrong / 88 declined. 48 of the 93
      declines still had the correct leader, 14 had no candidate.
  generated-withheld:
    kind: typed
    path: eval/typed/gate-withheld-20260930T230641.jsonl
    sha256: c23293178e2e57ec75197342a730acd9f2b8e244d9c200add5e585f66add0b25
    note: >-
      The generated set's questions re-asked with their answers ABSENT: for each question,
      every document with any chunk the grader's matcher finds the gold (or a variant) in,
      plus the question's own source, is withheld from retrieval, and the deliberative rung is
      off (`eval.run --withhold-source`, `eval/withheld.py`). Declining is right, an assertion
      is wrong, and an assertion matching the gold would be a leak (none). 188 of the 212
      questions; the other 24 were skipped because more than 500 documents attest their
      answer. Re-run 2026-09-30 with the `cite` row on the corpus pin full-2026-06-11: 0
      right / 3 wrong / 0 cite-right / 11 cite-wrong / 174 declined, 0 leaks, 61 rows with a
      candidate (mean `p1` 0.445). A cite here is wrong by construction (every attesting
      document is withheld), so the 11 are the price of the row on questions the corpus
      cannot answer: 9 were declines on the same day's row without it (0/5/183), 2 were
      wrong values that became wrong pointers, and 3 wrong values remain. At the folded gauge
      the row's U falls 0.738 over the 188 (11 pointers at -1 against 2 wrongs at -5.131
      saved), predicted 13 wrong pointers from the captured states. Wrong here is the cost
      of answering a question whose answer is not in the corpus; it reads calibration on
      unanswerable questions, where the answerable sets read it only on answerable ones.
  atm:
    kind: typed
    root_env: LIFE_AGENT_ATM_KB
    path: eval/typed/gate-typed-20260920T212441.jsonl
    sha256: b2ad6f4919c5b6fb5dcf8f2a1e2d914ce2ab7bca0449d5721fda14349f1dafec
    note: >-
      Somebody else's corpus and somebody else's questions — the only row here whose
      difficulty this project did not choose. ATM-Bench at pinned revision
      78e826dc07e97466b2f54443831ef9a83ab8b27c, built into its own KB root by `make sets`
      (6742 emails; CC-BY-NC, so it stays on the machine that built it and this row names
      its root by environment variable rather than a path). 198 of the 381 questions: the
      build marks the other 183 `fuzzy`, graded by resemblance, and a judge-graded row is
      not on this board. J1's host Bayes act, COLD on a second machine 2026-09-20 at the
      owner's folded gauge and the menu's declared prices ($2.02 for the 198; metered
      $3.80). 26 right / 5 wrong / 167 declined, nothing censored — every gold chunk was
      present, so the declines are the act's and not the catalogue's.
      **Read the U/q as a floor, not an error rate.** All five wrongs were re-asked
      through the same bridge and NONE is an invention: each named the gold fact in
      another surface form (gold `June 30, 2024.` against `June 30th, 2024`; gold
      `from 9:30am to 10:30am.` against `9:30am to 10:30am`; one, `July 4th` for
      `July 4th, 2025.`, dropped the year). Exact match is the declared grader and this
      row is scored by it unaltered, but ATM's gold is the dataset author's prose, not a
      span lifted from the document: only 77 of the 198 golds appear verbatim in their own
      cited email, so 121 of these questions do not meet this project's own MVP
      precondition. Re-cutting the set on that precondition is an eval-question change and
      is the owner's to take. First pin either way: the baseline, no incumbent.
  live:
    kind: pending
    note: the live stream since the reset; scored from J4
  sample:
    kind: typed
    root: repo
    path: eval/sample/typed-20260920.jsonl
    sha256: 0673ee06a047c490bd305577f3eebfbb79f00dde12e3aa256e4bdc6b2f7f9b9e
    note: >-
      The one row a stranger can reproduce from a clone. The bundled synthetic corpus
      (examples/sample-corpus, 8 documents, the fictional Ada Lovelace) built by
      scripts/bootstrap-sample.sh; 14 questions generated from it by the same `make golden`
      recipe the owner's set uses (eval/sample/questions.yaml, sha256 9a24703502...), answered
