  generated-withheld:
    kind: typed
    path: eval/typed/gate-withheld-20261001T100303.jsonl
    sha256: 42f8fbf079e65db9359359ef5b66c653aa7bf7cf750197b558f5cdcb57c3398e
    note: >-
      The generated set's questions re-asked with their answers ABSENT: for each question,
      every document with any chunk the grader's matcher finds the gold (or a variant) in,
      plus the question's own source, is withheld from retrieval, and the deliberative rung is
      off (`eval.run --withhold-source`, `eval/withheld.py`). Declining is right, an assertion
      is wrong, and an assertion matching the gold would be a leak (none). 188 of the 212
      questions; the other 24 were skipped because more than 500 documents attest their
      answer. Re-run 2026-10-01 with every elicited half-life scaled by 2
      (`pricing.HALF_LIFE_SCALE`) on the corpus pin full-2026-06-11: 0 right / 5 wrong / 0
      cite-right / 17 cite-wrong / 166 declined, 0 leaks, 61 rows with a candidate (mean
      `p1` 0.467), list $0.81, metered $0.11. A cite here is wrong by construction (every
      attesting document is withheld); every assertion is the price of answering a question
      the corpus cannot answer. Against the 2026-09-30 row at the elicited half-lives (0/3 +
      0/11 + 174): the 3 wrong values stand, 2 wrong pointers became wrong values, 8 declines
      became wrong pointers, 9 pointers and 166 declines stand. The one fall on this change:
      ΔU -16.3 over the 188 at the folded gauge (2 more wrongs at -5.131, 6 more pointers at
      -1) against +0.055 and +0.076 per question on `owner` and `generated`. The scale was
      fitted out of fold with these negatives in and held their respond rows at 3 wrongs
