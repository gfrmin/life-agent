# The scoreboard's sets. `path` is relative to $LIFE_AGENT_KB (owner data never enters the
# repo); `sha256` pins the bytes, so a board row names exactly what it scored. A set whose
# file is absent is listed as "not scored" with the reason, never silently dropped.
#
# kind: paired — one JSONL row per question, `typed` and `mono` (the recorded oracle) arms
# on the same row, as a gate run archives them. The board scores three arms from it:
# typed, oracle, and router (typed where typed asserted, otherwise the oracle — a
# recombination of recorded responses, no model call).
sets:
  owner:
    kind: paired
    path: eval/gate-outside-option/paired-gate-20260920T160935-strict.jsonl
    sha256: de0078c94030a2e7a4625071e1c0653cdc39d654c60ea85079c107d95e83d147
    note: >-
      J1's host Bayes act (core/decide.bayes_act) over the owner's 104 questions
      (2026-09-20, corpus pin full-2026-06-11), both arms on ONE GRADER and ONE PRICE LIST:
      each arm is graded on the answer it commits, by exact match, and priced at its declared
      prices (the typed arm's applied probes at the menu's prices, cache or no cache; the
      outside arm is the live deliberative rung's ANSWER line at the cost the call recorded).
      Replaces run 18 (the Julia daemon, 2026-08-26: typed 61/2/41 at $20.95, U/q +0.220 on
      the same grader and prices; its record is paired-gate-20260826T083356-strict-priced.jsonl).
      The daemon's 13 extra right answers came with 2 wrongs and a policy that called the
