[project]
name = "life-agent"
version = "0.0.1"
description = "Personal life-management assistant — a monorepo of two packages: pkm (content-addressed extraction + catalogue) and life_agent (retrieval, synthesis, and action over it)."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- pkm (extraction faculty) ---
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "pypandoc>=1.13",
    "docling>=2.14",
    # Unstructured's optional format dependencies, added as specific
    # formats have surfaced in real corpora. Do not pre-empt — add
    # each only when a real extraction failure names it:
    #   .xlsx                → openpyxl (already transitive)
    #   .xls                 → xlrd (added 2026-04-21, 500-doc run)
    #   .xls/.xlsx protected → msoffcrypto-tool (added 2026-04-21)
    "unstructured>=0.16",
    "msoffcrypto-tool>=6.0.0",
    "xlrd>=2.0.2",
    # Docling pre-flight: pikepdf detects encrypted PDFs (cheap
    # header parse) so the producer can return a specific error
    # rather than Docling's uninformative status=FAILURE. Added
    # 2026-04-22 after the 1000-doc run's WTW-salaries PDF cluster.
    "pikepdf>=10.5.1",
    # Transform output validation (SPEC v0.2.0 §20.2).
    "jsonschema>=4.23",
    # LLM provider SDK for Phase 2 transforms (SPEC v0.2.0 §20).
    "anthropic>=0.42",
    # HTML-body stripping in the email producer (SPEC v0.5.0 §7.2).
    "beautifulsoup4>=4.12",
    # MCP stdio server for the `pkm serve` query surface (SPEC §17).
    "mcp>=1.0",
]

[project.scripts]
pkm = "pkm.cli:main"
trips = "life_agent.trips.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.26.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm", "src/life_agent"]

[tool.ruff]
# pkm holds to 88; life_agent code is ~100 wide. 100 satisfies both (pkm's longest line is 84).
line-length = 100
# r51b 2e: ATM-Bench's evaluator is vendored byte-for-byte at a pinned sha (its SOURCE names the
# one edit per file); upstream style is not ours to lint.
extend-exclude = ["scripts/atm_bench/vendored"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# `import life_agent.core as C` / `import _common as C` is the harness's deliberate alias.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["life_agent", "pkm"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings + the bot's LLM system prompt read clearer on one line than wrapped.
# The GTD read-model: long SQL read queries.
"src/life_agent/tasks/store.py" = ["E501"]
# The Telegram reach: the LLM system prompt + the digest's SQL.
"src/life_agent/reach/jarvis.py" = ["E501"]
"src/life_agent/reach/digest.py" = ["E501"]

[tool.mypy]
# `uv run mypy` (no args) checks all production code: the source packages (pkm +
# life_agent) under the full strict gate (override below — both already pass), and
# scripts/ under this lenient baseline (real type bugs surface, annotations not demanded).
# tests/ are deliberately NOT gated: the suite passes intentional fakes — wrong types to
# assert rejection (e.g. test_hashing → compute_cache_key), fetchone()[0] without a
# None-guard, partial protocol stand-ins — so strict body-checking there fights the test
# design rather than finding bugs (a full tests pass surfaced 0 production bugs). pytest
# is the gate for tests.
files = ["src", "scripts"]
# r51b 2e: the vendored ATM-Bench evaluator is upstream code at a pinned sha, not ours to type.
exclude = ['^scripts/atm_bench/vendored/']
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# The library surface (both packages already pass) is held to the full strict gate.
# `strict = true` is not honoured per-module (it leaks global), so the flags are spelt out.
module = ["pkm.*", "life_agent.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: two packages' test trees coexist under tests/ (life_agent at top,
# pkm under tests/pkm/) without sys.path collisions — e.g. the real `pkm` package isn't
# shadowed by tests/pkm/, and the two test_pii_guard.py files don't clash.
# Both `llm` and `system` are skipped by default: they make live LLM calls or run
# heavy ML producers (docling/tesseract) whose output is not byte-stable, so they
# are non-deterministic by nature and must not pollute the default signal. Run them
# explicitly when the runtime is present: `pytest -m system` / `pytest -m llm`.
addopts = "-m 'not llm and not system' --import-mode=importlib"
markers = [
    "llm: tests requiring live LLM API calls (non-deterministic; opt-in via -m llm)",
    "system: tests running heavy ML producers (docling/tesseract); non-deterministic output, opt-in via -m system",
]

[[tool.mypy.overrides]]
# r51b 2e: followed imports into the vendored ATM-Bench evaluator are not checked (pinned upstream code).
module = ["atm_bench.vendored.*"]
ignore_errors = true
