[project]
name = "life-agent"
version = "0.0.1"
description = "Personal life-management assistant — the Python memory layer (retrieval + synthesis) over pkm."
requires-python = ">=3.13,<3.14"   # match pkm so the shared interpreter resolves
dependencies = [
    # pkm is the memory core (content-addressed catalogue + FTS retrieval). Consumed as an
    # editable path dependency (see [tool.uv.sources]); life-agent is its composition root.
    "pkm",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

# pkm lives beside this repo and has its own lifecycle — depend on it by path (editable), not
# a published version. This makes `uv run --project .` yield one env with both life_agent and pkm.
[tool.uv.sources]
pkm = { path = "../pkm", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_agent"]

[tool.ruff]
# This repo's Python predates a linter and is written ~100 cols wide (pkm holds to 88, but its
# code was linted from day one). Match the existing width rather than reflow it all.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# `import life_agent.core as C` / `import _common as C` is the harness's deliberate alias.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["life_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
